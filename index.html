<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="color-scheme" content="light only" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="Bibliothèque privée d'insights YouTube — lecture directe, sans téléchargement." />
  <title>Insights — Bibliothèque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.20261005140549.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div>
          <p class="brand-eyebrow">Collection privée</p>
          <h1 class="brand-title">Insights</h1>
        </div>
      </div>
      <p class="header-desc">Extraits YouTube sélectionnés — lecture directe, sans téléchargement.</p>
    </div>
  </header>

  <main class="main">
    <nav class="filters" id="filters" aria-label="Filtrer par thème">
      <button type="button" class="filter-btn is-active" data-filter="all">Tout</button>
    </nav>

    <p class="result-count" id="result-count" aria-live="polite"></p>

    <section class="grid" id="pepites-grid" aria-label="Liste des insights"></section>

    <p class="empty-state" id="empty-state" hidden>
      Aucun insight pour ce filtre.
    </p>
  </main>

  <footer class="site-footer">
    <p>Liens YouTube horodatés uniquement · Ajoutez des insights via <code>pepites.json</code></p>
  </footer>

  <template id="card-template">
    <article class="card">
      <aside class="cover">
        <div class="cover-stage">
          <button type="button" class="cover-facade" aria-label="">
            <div class="cover-inner">
              <p class="cover-label"></p>
              <div class="cover-title-wrap">
                <p class="cover-title"></p>
              </div>
              <div class="cover-footer">
                <span class="cover-meta"></span>
              </div>
            </div>
            <span class="cover-cue" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                <path d="M9 7.5v9l8-4.5-8-4.5z" fill="currentColor"/>
              </svg>
            </span>
          </button>
        </div>
      </aside>
      <div class="card-body">
        <div class="card-meta">
          <span class="theme-pill"></span>
          <span class="time-range"></span>
        </div>
        <h2 class="card-title"></h2>
        <p class="card-source"></p>
        <p class="card-summary"></p>
        <div class="card-actions">
          <a class="lire-passage" target="_blank" rel="noopener noreferrer">Lire le passage</a>
          <button type="button" class="copy-passage-btn">
            <span class="copy-label">Copier le lien</span>
          </button>
          <a class="yt-link" target="_blank" rel="noopener noreferrer">
            <span>Voir sur YouTube</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
    </article>
  </template>

  <script src="app.20261005140549.js"></script>
</body>
</html>
